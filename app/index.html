<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11161a">
<meta name="mobile-web-app-capable" content="yes">
<title>Hover Trainer</title>
<!--MANIFEST-->
<style>
:root {
  --panel: rgba(16, 20, 22, 0.78);
  --panel-solid: #161b1e;
  --line: rgba(255, 255, 255, 0.12);
  --ink: #eef2ef;
  --muted: #9aa6a0;
  --accent: #ff8a3d;
  --ok: #4be37a;
  --warn: #ffd23f;
  --bad: #ff5a4e;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pad-l: max(12px, env(safe-area-inset-left, 0px));
  --pad-r: max(12px, env(safe-area-inset-right, 0px));
  --pad-t: max(10px, env(safe-area-inset-top, 0px));
  --pad-b: max(10px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #11161a; color: var(--ink); font: 14px/1.4 var(--font); -webkit-tap-highlight-color: transparent; }
#stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible + label, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a0f05; font-weight: 600; }

/* HUD */
#hud { position: fixed; top: var(--pad-t); left: var(--pad-l); display: grid; gap: 6px; pointer-events: none; max-width: calc(100% - 200px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font: 600 12px/1.4 var(--mono); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
.chip.dim { color: var(--muted); font-weight: 400; }
.chip.mode-idle { border-color: var(--accent); color: var(--accent); }
.chip.mode-hold { border-color: var(--bad); color: var(--bad); }
.chip.inv { border-color: var(--warn); color: var(--warn); }
.chip.slow { border-color: #6fb6ff; color: #6fb6ff; }
.score { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 4px 10px; font: 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; width: fit-content; }
.score.in { border-left-color: var(--ok); } .score.out { border-left-color: var(--bad); }
.score b { color: var(--warn); } .score.in b { color: var(--ok); } .score.out b { color: var(--bad); }

#top { position: fixed; top: var(--pad-t); right: var(--pad-r); display: flex; gap: 6px; }
#top button { padding: 8px 12px; }
#modes { position: fixed; bottom: var(--pad-b); left: 50%; transform: translateX(-50%); display: flex; gap: 0; }
#modes button { border-radius: 0; padding: 8px 12px; font-size: 13px; }
#modes button:first-child { border-radius: 8px 0 0 8px; } #modes button:last-child { border-radius: 0 8px 8px 0; }
#modes button.on { background: var(--accent); color: #1a0f05; border-color: var(--accent); font-weight: 600; }
#modes button.on[data-mode="hold"] { background: var(--bad); border-color: var(--bad); }

#toast { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; font-size: 16px; font-weight: 600; pointer-events: none; text-align: center; z-index: 20; }

/* touch sticks */
#sticks { position: fixed; inset: auto 0 0 0; pointer-events: none; }
.stick { position: fixed; bottom: calc(var(--pad-b) + 4px); width: min(40vh, 34vw, 210px); aspect-ratio: 1; pointer-events: auto; touch-action: none; border-radius: 14px; background: rgba(10, 14, 16, 0.28); border: 1px solid rgba(255, 255, 255, 0.22); }
.stick-left { left: var(--pad-l); } .stick-right { right: var(--pad-r); }
.stick.active { background: rgba(10, 14, 16, 0.4); }
.stick-gate { position: absolute; inset: 8%; border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: 8px; }
.stick-gate::before, .stick-gate::after { content: ""; position: absolute; background: rgba(255, 255, 255, 0.16); }
.stick-gate::before { left: 50%; top: 0; bottom: 0; width: 1px; } .stick-gate::after { top: 50%; left: 0; right: 0; height: 1px; }
.stick-knob { position: absolute; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255, 138, 61, 0.85); box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
.stick-label { position: absolute; bottom: -1.5em; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.04em; }

/* VR */
body.vr #hud, body.vr #top, body.vr #modes, body.vr #sticks { display: none; }
#vr-exit { position: fixed; top: var(--pad-t); left: 50%; transform: translateX(-50%); display: none; opacity: 0.6; }
body.vr #vr-exit { display: block; }

/* settings sheet */
#sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel-solid); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 5; }
.sheet-head { display: flex; gap: 8px; align-items: center; padding: var(--pad-t) var(--pad-r) 8px 12px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
.tabs button { background: transparent; border-color: transparent; padding: 6px 10px; white-space: nowrap; color: var(--muted); }
.tabs button.on { color: var(--ink); border-color: var(--line); background: rgba(255, 255, 255, 0.06); }
.close { flex: none; }
.sheet-body { overflow-y: auto; padding: 12px var(--pad-r) calc(var(--pad-b) + 16px) 14px; display: grid; gap: 14px; align-content: start; }
.field { margin: 0; padding: 0; border: 0; min-width: 0; display: grid; gap: 6px; }
legend, .slider label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 0; margin-bottom: 6px; }
.seg-row { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-row input { position: absolute; opacity: 0; pointer-events: none; }
.seg-row label { padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; font-size: 13px; }
.seg-row input:checked + label { background: var(--accent); border-color: var(--accent); color: #1a0f05; font-weight: 600; }
.toggle { grid-template-columns: auto 1fr; align-items: center; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.toggle label { display: grid; } .toggle small { color: var(--muted); font-size: 12px; }
.slider label { display: flex; justify-content: space-between; margin: 0; }
.slider output { color: var(--ink); font: 12px var(--mono); text-transform: none; letter-spacing: 0; }
.slider input { width: 100%; accent-color: var(--accent); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { font-size: 13px; padding: 6px 10px; }
.preset.on { border-color: var(--accent); color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; max-width: 60ch; }
.status { margin: 0; font: 12px var(--mono); overflow-wrap: anywhere; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 10px; }
details[open] { display: grid; }
summary { cursor: pointer; font-weight: 600; }
details ol { margin: 6px 0 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.monitor, .live { display: grid; gap: 4px; }
.mon-row, .live-ch { display: grid; grid-template-columns: 6.5em 1fr 3.5em; gap: 8px; align-items: center; font-size: 12px; }
.live-ch { grid-template-columns: 3.5em 1fr; }
.mon-row code { font: 11px var(--mono); color: var(--muted); }
.bar { position: relative; height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; }
.bar i { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--accent); }
.bar i.goal { width: 12px; margin-left: -6px; background: var(--ok); opacity: 0.6; }
.score.wait .bar { margin-top: 6px; }

#wizard { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; z-index: 10; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); }
.wiz-card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; }
.wiz-step { margin: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.wiz-text { margin: 0; font-size: 16px; font-weight: 600; }
/* flight school */
.chip.school { border-color: var(--ok); color: var(--ok); }
.sheet-body h2 { margin: 6px 0 0; font-size: 15px; }
.lesson { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.lesson h3 { margin: 0; font-size: 15px; color: var(--accent); }
.lesson p, .lesson ul { margin: 0; font-size: 13px; }
.lesson ul { padding-left: 1.2em; color: var(--muted); }
.lesson .goal b { color: var(--ok); }
.plan { display: grid; gap: 12px; }
.credit { margin: 0; font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.credit a, button.link { color: var(--accent); }
button.link { background: none; border: 0; padding: 0; text-decoration: underline; }
.callout { margin: 0; padding: 8px 10px; border-radius: 8px; background: rgba(75, 227, 122, 0.1); border: 1px solid rgba(75, 227, 122, 0.35); font-size: 13px; display: grid; gap: 6px; }
.callout.warn { background: rgba(255, 210, 63, 0.1); border-color: rgba(255, 210, 63, 0.4); }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
select, input[type="number"], input[type="datetime-local"], textarea { font: inherit; color: var(--ink); background: #0f1315; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
.log { display: grid; gap: 4px; }
.log-row { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 2px 8px; align-items: baseline; text-align: left; font-size: 12.5px; padding: 6px 8px; }
.log-row small { grid-column: 2 / -1; color: var(--muted); }
.log-row b { font: 600 12px var(--mono); color: var(--warn); } .log-row b.ok { color: var(--ok); }
.log-row.jump { border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" aria-live="polite"></div>
<div id="top">
  <button id="btn-reset" type="button">Reset</button>
  <button id="btn-full" type="button" aria-label="Full screen">Full screen</button>
  <button id="btn-vr" type="button">3D</button>
  <button id="btn-menu" type="button">Settings</button>
</div>
<div id="modes" role="group" aria-label="Flight mode"></div>
<div id="sticks"></div>
<div id="toast" hidden></div>
<button id="vr-exit" type="button">Exit VR</button>
<div id="sheet" hidden></div>
<div id="wizard" hidden></div>
<!--APP-->
</body>
</html>
